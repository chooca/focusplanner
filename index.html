<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus | Task Planner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Hide Scrollbar but keep functionality for clean look */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth fade in for tasks */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item {
            animation: fadeIn 0.2s ease-out forwards;
        }
        
        /* Custom Checkbox styles */
        .checkbox-work.checked { background-color: #6366f1; border-color: #6366f1; }
        .checkbox-private.checked { background-color: #10b981; border-color: #10b981; }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800 overflow-hidden">

    <!-- Header -->
    <header class="flex-shrink-0 pt-8 pb-4 px-6 md:px-10 max-w-7xl mx-auto w-full flex items-center justify-between">
        <div>
            <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-slate-900">Focus</h1>
            <p class="text-sm text-slate-500 mt-1" id="date-display">Organize your day</p>
        </div>
        
        <!-- Import / Export Actions -->
        <div class="flex items-center gap-3">
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
            
            <button onclick="document.getElementById('import-file').click()" class="flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-slate-900 bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-100 transition-all active:scale-95" title="Import JSON">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                <span class="hidden sm:inline">Import</span>
            </button>
            
            <button onclick="exportData()" class="flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-slate-900 bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-100 transition-all active:scale-95" title="Export JSON">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
                <span class="hidden sm:inline">Export</span>
            </button>
        </div>
    </header>

    <!-- Mobile Tabs (Hidden on Desktop) -->
    <div class="md:hidden px-6 mb-4 max-w-7xl w-full mx-auto flex-shrink-0">
        <div class="flex p-1 bg-slate-200/50 rounded-xl">
            <button id="tab-work" onclick="switchTab('work')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-indigo-600 transition-all">
                Work
            </button>
            <button id="tab-private" onclick="switchTab('private')" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all">
                Private
            </button>
        </div>
    </div>

    <!-- Main Content Grid -->
    <main class="flex-1 overflow-hidden px-4 md:px-10 pb-8 max-w-7xl mx-auto w-full">
        <div class="flex flex-col md:flex-row gap-6 h-full w-full">
            
            <!-- Work Column -->
            <section id="col-work" class="flex-1 flex flex-col bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden h-full">
                <div class="px-8 pt-8 pb-4 flex items-center justify-between flex-shrink-0">
                    <h2 class="text-xl font-medium flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.4)]"></span>
                        Work
                    </h2>
                    <span id="work-count" class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md">0</span>
                </div>
                
                <div id="work-list" class="flex-1 overflow-y-auto px-6 pb-2 hide-scroll space-y-1">
                    <!-- Tasks injected here -->
                </div>

                <div class="p-6 pt-2 flex-shrink-0">
                    <form onsubmit="handleAddTask(event, 'work')" class="relative flex items-center">
                        <input type="text" id="input-work" placeholder="Add a work task..." autocomplete="off"
                            class="w-full bg-slate-50 border border-transparent focus:bg-white focus:border-indigo-200 focus:ring-4 focus:ring-indigo-500/10 rounded-xl pl-5 pr-12 py-3.5 text-sm transition-all outline-none placeholder:text-slate-400">
                        <button type="submit" class="absolute right-3 p-2 text-slate-400 hover:text-indigo-600 transition-colors" title="Add Task">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                                <path fill-rule="evenodd" d="M12 3.75a.75.75 0 01.75.75v6.75h6.75a.75.75 0 010 1.5h-6.75v6.75a.75.75 0 01-1.5 0v-6.75H4.5a.75.75 0 010-1.5h6.75V4.5a.75.75 0 01.75-.75z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Private Column -->
            <section id="col-private" class="flex-1 flex flex-col bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden h-full hidden md:flex">
                <div class="px-8 pt-8 pb-4 flex items-center justify-between flex-shrink-0">
                    <h2 class="text-xl font-medium flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.4)]"></span>
                        Private
                    </h2>
                    <span id="private-count" class="text-xs font-semibold bg-emerald-50 text-emerald-600 px-2 py-1 rounded-md">0</span>
                </div>
                
                <div id="private-list" class="flex-1 overflow-y-auto px-6 pb-2 hide-scroll space-y-1">
                    <!-- Tasks injected here -->
                </div>

                <div class="p-6 pt-2 flex-shrink-0">
                    <form onsubmit="handleAddTask(event, 'private')" class="relative flex items-center">
                        <input type="text" id="input-private" placeholder="Add a private task..." autocomplete="off"
                            class="w-full bg-slate-50 border border-transparent focus:bg-white focus:border-emerald-200 focus:ring-4 focus:ring-emerald-500/10 rounded-xl pl-5 pr-12 py-3.5 text-sm transition-all outline-none placeholder:text-slate-400">
                        <button type="submit" class="absolute right-3 p-2 text-slate-400 hover:text-emerald-600 transition-colors" title="Add Task">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                                <path fill-rule="evenodd" d="M12 3.75a.75.75 0 01.75.75v6.75h6.75a.75.75 0 010 1.5h-6.75v6.75a.75.75 0 01-1.5 0v-6.75H4.5a.75.75 0 010-1.5h6.75V4.5a.75.75 0 01.75-.75z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast Notification (Replaces alerts) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-sm font-medium">
        Notification
    </div>

    <!-- App Logic -->
    <script>
        // Data & State
        const STORAGE_KEY = 'duality_tasks_local';
        let tasks = [];
        let currentTab = 'work'; // Track mobile view state

        // Display Today's Date
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', dateOptions);

        // SVG Icons used in rendering
        const icons = {
            check: `<svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`,
            trash: `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`,
            empty: `<div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-50 select-none mt-10"><svg class="w-12 h-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg><p class="text-sm">All caught up</p></div>`
        };

        // Utility: Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        // Utility: Generate Unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        // Utility: Escape HTML to prevent XSS
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Initialize App
        function initApp() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            
            if (storedData) {
                try {
                    tasks = JSON.parse(storedData);
                } catch (e) {
                    console.error("Failed to parse local storage", e);
                    loadDefaultTasks();
                }
            } else {
                loadDefaultTasks();
            }
            
            // Ensure mobile view logic runs cleanly on boot
            switchTab('work');
            renderTasks();
        }

        // Placeholder Tasks for initial state
        function loadDefaultTasks() {
            const now = Date.now();
            tasks = [
                { id: generateId(), text: 'Draft funding request for school 11G38', category: 'work', completed: false, createdAt: now },
                { id: generateId(), text: 'Prepare Haushaltsausschuss presentation', category: 'work', completed: false, createdAt: now + 1 },
                { id: generateId(), text: 'Outline romance novel chapter', category: 'private', completed: false, createdAt: now + 2 },
                { id: generateId(), text: 'Python practice', category: 'private', completed: false, createdAt: now + 3 }
            ];
            saveTasks();
        }

        // Save to LocalStorage and re-render
        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            renderTasks();
        }

        // Render UI
        function renderTasks() {
            const workList = document.getElementById('work-list');
            const privateList = document.getElementById('private-list');
            
            // Sort to keep newest at the bottom or maintain creation order
            const sortedTasks = [...tasks].sort((a, b) => a.createdAt - b.createdAt);
            
            const workTasks = sortedTasks.filter(t => t.category === 'work');
            const privateTasks = sortedTasks.filter(t => t.category === 'private');

            // Update Counts
            document.getElementById('work-count').textContent = workTasks.filter(t => !t.completed).length;
            document.getElementById('private-count').textContent = privateTasks.filter(t => !t.completed).length;

            const buildHTML = (taskList, type) => {
                if (taskList.length === 0) return icons.empty;
                
                const themeClass = type === 'work' ? 'checkbox-work' : 'checkbox-private';
                const hoverBg = 'hover:bg-slate-50';

                return taskList.map(task => `
                    <div class="task-item group flex items-start gap-3 p-2.5 -mx-2.5 rounded-xl ${hoverBg} transition-colors">
                        <button onclick="toggleTask('${task.id}')" 
                            class="mt-0.5 w-5 h-5 flex-shrink-0 rounded border transition-colors flex items-center justify-center
                                   ${task.completed ? `${themeClass} checked` : 'border-slate-300 bg-white group-hover:border-slate-400'}">
                            ${task.completed ? icons.check : ''}
                        </button>
                        <span class="flex-1 text-[15px] leading-snug pt-[1px] transition-all
                            ${task.completed ? 'text-slate-400 line-through' : 'text-slate-700 group-hover:text-slate-900'}">
                            ${escapeHTML(task.text)}
                        </span>
                        <button onclick="deleteTask('${task.id}')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-opacity p-1 -m-1 focus:opacity-100" title="Delete">
                            ${icons.trash}
                        </button>
                    </div>
                `).join('');
            };

            workList.innerHTML = buildHTML(workTasks, 'work');
            privateList.innerHTML = buildHTML(privateTasks, 'private');
        }

        // --- Action Handlers ---

        // Add Task
        window.handleAddTask = (e, category) => {
            e.preventDefault();
            
            const inputEle = document.getElementById(`input-${category}`);
            const text = inputEle.value.trim();
            
            if (!text) return;
            
            inputEle.value = ''; // clear immediately for UX
            
            tasks.push({
                id: generateId(),
                text: text,
                category: category,
                completed: false,
                createdAt: Date.now()
            });
            
            saveTasks();
        };

        // Toggle Complete
        window.toggleTask = (taskId) => {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
            }
        };

        // Delete Task
        window.deleteTask = (taskId) => {
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
        };

        // --- Data Import/Export (JSON) ---

        window.exportData = () => {
            const dataStr = JSON.stringify(tasks, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.download = "tasks.json";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast("Tasks exported successfully");
        };

        window.importData = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedTasks = JSON.parse(e.target.result);
                    
                    // Basic validation to ensure it looks like our task array
                    if (Array.isArray(importedTasks) && importedTasks.every(t => t.id && t.text && t.category)) {
                        tasks = importedTasks;
                        saveTasks();
                        showToast("Tasks imported successfully");
                    } else {
                        showToast("Invalid tasks format in JSON file");
                    }
                } catch (err) {
                    console.error("Import error:", err);
                    showToast("Error reading JSON file");
                }
                // Reset input so the same file can be uploaded again if needed
                event.target.value = '';
            };
            reader.readAsText(file);
        };

        // --- Mobile Layout Logic ---

        window.switchTab = (tab) => {
            currentTab = tab;
            const isMobile = window.innerWidth < 768;
            if (!isMobile) return;

            const workCol = document.getElementById('col-work');
            const privateCol = document.getElementById('col-private');
            const tabWork = document.getElementById('tab-work');
            const tabPrivate = document.getElementById('tab-private');

            if (tab === 'work') {
                workCol.classList.remove('hidden');
                privateCol.classList.add('hidden');
                
                tabWork.className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-indigo-600 transition-all';
                tabPrivate.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all';
            } else {
                workCol.classList.add('hidden');
                privateCol.classList.remove('hidden');
                
                tabPrivate.className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-emerald-600 transition-all';
                tabWork.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all';
            }
        };

        // Handle Resize to fix layout if screen rotates or resizes
        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth < 768;
            if (!isMobile) {
                document.getElementById('col-work').classList.remove('hidden');
                document.getElementById('col-private').classList.remove('hidden');
            } else {
                window.switchTab(currentTab); // Re-apply mobile state
            }
        });

        // Boot
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
